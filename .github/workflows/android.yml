name: Build Sefareshgir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inspect project files
        run: |
          pwd
          ls -la
          echo "---- SETTINGS FILE ----"
          cat settings.gradle
          echo "---- APP DIRECTORY ----"
          ls -la app
      - name: Check Gradle projects
        run: gradle projects

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sefareshgir-APK
          path: app/build/outputs/apk/debug/app-debug.apk
